name: frontend
description: "EduPulse - School Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1

  # Declarative Routing & Shell Navigation
  go_router: ^14.8.1

  # UI, Fonts & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Utilities & Data Formatting
  intl: ^0.20.2
  uuid: ^4.5.1

  # File & Document Handling (UI Simulation)
  file_picker: ^8.1.7
  shared_preferences: ^2.5.6
  http: ^1.6.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/admin/
    - assets/data/admissions/
    - assets/data/auth/
    - assets/data/staff/
    - assets/data/classes/
    - assets/data/students/
    - assets/data/academics/
    - assets/data/attendance/
    - assets/data/coursework/
    - assets/data/examinations/
    - assets/data/finance/
    - assets/data/transfers/
    - assets/data/announcements/
    - assets/images/
    - assets/icons/
